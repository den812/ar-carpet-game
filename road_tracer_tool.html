<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛣️ Road Tracer - Трассировка дорог с ковра</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow: hidden;
    }
    
    #container {
      display: flex;
      height: 100vh;
    }
    
    #canvas-area {
      flex: 1;
      position: relative;
      background: #1a1a2e;
      overflow: auto;
    }
    
    #carpet-canvas {
      display: block;
      cursor: crosshair;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    
    #sidebar {
      width: 350px;
      background: #16213e;
      color: #fff;
      padding: 20px;
      overflow-y: auto;
      box-shadow: -5px 0 15px rgba(0,0,0,0.3);
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #4ecca3;
      text-align: center;
    }
    
    .section {
      background: #0f3460;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    
    .section h3 {
      color: #4ecca3;
      margin-bottom: 10px;
      font-size: 16px;
    }
    
    button {
      width: 100%;
      padding: 12px;
      margin: 5px 0;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    button.primary {
      background: linear-gradient(135deg, #4ecca3, #45b393);
      color: #000;
    }
    
    button.danger {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: #fff;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    
    #node-list {
      max-height: 300px;
      overflow-y: auto;
      background: #1a1a2e;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
    }
    
    .node-item {
      padding: 5px;
      margin: 2px 0;
      background: #0f3460;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
    }
    
    #stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    
    .stat-box {
      background: #1a1a2e;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 24px;
      color: #4ecca3;
      font-weight: bold;
    }
    
    .stat-label {
      font-size: 12px;
      color: #aaa;
    }
    
    input[type="file"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 2px dashed #4ecca3;
      border-radius: 8px;
      background: #0f3460;
      color: #fff;
      cursor: pointer;
    }
    
    textarea {
      width: 100%;
      height: 200px;
      padding: 10px;
      background: #1a1a2e;
      color: #4ecca3;
      border: 2px solid #4ecca3;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="canvas-area">
      <canvas id="carpet-canvas"></canvas>
    </div>
    
    <div id="sidebar">
      <h1>🛣️ Road Tracer</h1>
      
      <div class="section">
        <h3>📁 Загрузка изображения</h3>
        <input type="file" id="image-input" accept="image/*">
        <button class="primary" onclick="loadCarpetImage()">🖼️ Загрузить carpet-scan.jpg</button>
      </div>
      
      <div class="section">
        <h3>🖱️ Инструменты</h3>
        <button class="primary" onclick="setMode('node')">📍 Добавить узел (клик)</button>
        <button class="primary" onclick="setMode('connection')">🔗 Соединить узлы (2 клика)</button>
        <button class="danger" onclick="deleteLastNode()">❌ Удалить последний</button>
        <button class="danger" onclick="clearAll()">🗑️ Очистить всё</button>
      </div>
      
      <div class="section">
        <h3>📊 Статистика</h3>
        <div id="stats">
          <div class="stat-box">
            <div class="stat-value" id="node-count">0</div>
            <div class="stat-label">Узлов</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="connection-count">0</div>
            <div class="stat-label">Связей</div>
          </div>
        </div>
      </div>
      
      <div class="section">
        <h3>📋 Список узлов</h3>
        <div id="node-list"></div>
      </div>
      
      <div class="section">
        <h3>💾 Экспорт</h3>
        <button class="primary" onclick="exportNodes()">📤 Экспортировать координаты</button>
        <textarea id="export-area" readonly placeholder="Координаты появятся здесь..."></textarea>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('carpet-canvas');
    const ctx = canvas.getContext('2d');
    
    let image = null;
    let nodes = [];
    let connections = [];
    let mode = 'node'; // 'node' или 'connection'
    let selectedNode = null;
    let scale = 1;
    
    // Загрузка изображения по URL
    function loadCarpetImage() {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        image = img;
        canvas.width = img.width;
        canvas.height = img.height;
        scale = 1;
        render();
        console.log('✅ Изображение загружено:', img.width, 'x', img.height);
      };
      img.onerror = () => {
        alert('Ошибка загрузки изображения. Загрузите файл вручную.');
      };
      img.src = './assets/carpet-scan.jpg';
    }
    
    // Загрузка через input
    document.getElementById('image-input').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          image = img;
          canvas.width = img.width;
          canvas.height = img.height;
          scale = 1;
          render();
          console.log('✅ Изображение загружено:', img.width, 'x', img.height);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };
    
    // Установка режима
    function setMode(newMode) {
      mode = newMode;
      selectedNode = null;
      console.log('🔧 Режим:', newMode);
    }
    
    // Клик по canvas
    canvas.onclick = (e) => {
      if (!image) {
        alert('Сначала загрузите изображение!');
        return;
      }
      
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / scale;
      const y = (e.clientY - rect.top) / scale;
      
      // Нормализуем координаты к диапазону [-1, 1]
      const normalizedX = ((x / image.width) * 2 - 1).toFixed(2);
      const normalizedY = ((y / image.height) * 2.5 - 1.25).toFixed(2); // Учитываем пропорции ковра 2.0 x 2.5
      
      if (mode === 'node') {
        // Добавляем узел
        nodes.push({ 
          x: parseFloat(normalizedX), 
          y: parseFloat(normalizedY),
          screenX: x,
          screenY: y
        });
        console.log('📍 Узел добавлен:', normalizedX, normalizedY);
        updateStats();
        render();
      } else if (mode === 'connection') {
        // Соединяем узлы
        const clickedNode = findNearestNode(x, y);
        
        if (clickedNode) {
          if (!selectedNode) {
            selectedNode = clickedNode;
            console.log('🔗 Выбран первый узел');
            render();
          } else {
            if (selectedNode !== clickedNode) {
              connections.push({ from: selectedNode, to: clickedNode });
              console.log('✅ Узлы соединены');
              updateStats();
            }
            selectedNode = null;
            render();
          }
        }
      }
    };
    
    // Найти ближайший узел
    function findNearestNode(x, y) {
      let nearest = null;
      let minDist = 20; // Радиус захвата
      
      for (const node of nodes) {
        const dist = Math.hypot(node.screenX - x, node.screenY - y);
        if (dist < minDist) {
          minDist = dist;
          nearest = node;
        }
      }
      
      return nearest;
    }
    
    // Удалить последний узел
    function deleteLastNode() {
      if (nodes.length === 0) return;
      nodes.pop();
      updateStats();
      render();
      console.log('❌ Последний узел удален');
    }
    
    // Очистить всё
    function clearAll() {
      if (!confirm('Удалить все узлы и связи?')) return;
      nodes = [];
      connections = [];
      selectedNode = null;
      updateStats();
      render();
      console.log('🗑️ Всё очищено');
    }
    
    // Обновить статистику
    function updateStats() {
      document.getElementById('node-count').textContent = nodes.length;
      document.getElementById('connection-count').textContent = connections.length;
      
      const listHtml = nodes.map((node, i) => 
        `<div class="node-item">
          <span>#${i}: (${node.x}, ${node.y})</span>
        </div>`
      ).join('');
      
      document.getElementById('node-list').innerHTML = listHtml || '<div style="text-align:center;color:#666;">Нет узлов</div>';
    }
    
    // Экспорт координат
    function exportNodes() {
      if (nodes.length === 0) {
        alert('Нет узлов для экспорта!');
        return;
      }
      
      const output = `// Узлы дорожной сети (${nodes.length} точек)\nconst nodes = [\n${
        nodes.map(n => `  { x: ${n.x}, y: ${n.y} }`).join(',\n')
      }\n];\n\n// Связи (${connections.length} соединений)\nconst connections = [\n${
        connections.map(c => {
          const fromIdx = nodes.indexOf(c.from);
          const toIdx = nodes.indexOf(c.to);
          return `  [${fromIdx}, ${toIdx}]`;
        }).join(',\n')
      }\n];`;
      
      document.getElementById('export-area').value = output;
      console.log('📤 Координаты экспортированы');
    }
    
    // Рендеринг
    function render() {
      if (!image) return;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(image, 0, 0);
      
      // Рисуем связи
      ctx.strokeStyle = '#00ff00';
      ctx.lineWidth = 3;
      for (const conn of connections) {
        ctx.beginPath();
        ctx.moveTo(conn.from.screenX, conn.from.screenY);
        ctx.lineTo(conn.to.screenX, conn.to.screenY);
        ctx.stroke();
      }
      
      // Рисуем узлы
      for (const node of nodes) {
        ctx.fillStyle = node === selectedNode ? '#ffff00' : '#ff0000';
        ctx.beginPath();
        ctx.arc(node.screenX, node.screenY, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
    
    // Автозагрузка при запуске
    window.onload = () => {
      console.log('🛣️ Road Tracer готов к работе');
      updateStats();
    };
  </script>
</body>
</html>
