name: Tests CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ============================================
  # Job 1: Unit & Integration Tests (Jest)
  # ============================================
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🟢 Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: 📦 Install dependencies
      run: npm ci
    
    - name: 🧪 Run Jest tests with coverage
      run: npm run test:coverage
      env:
        CI: true
    
    - name: 📊 Upload coverage to Codecov
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: 📦 Archive coverage results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-node-${{ matrix.node-version }}
        path: coverage/
        retention-days: 30

  # ============================================
  # Job 2: E2E Tests (Playwright)
  # ============================================
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit-tests  # Запускаем только если unit-тесты прошли
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: 📦 Install dependencies
      run: npm ci
    
    - name: 🎭 Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    
    - name: 🐍 Setup Python (for server)
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: 🧪 Run Playwright E2E tests
      run: npm run test:e2e
      env:
        CI: true
    
    - name: 📦 Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    
    - name: 📸 Upload test screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-screenshots
        path: test-results/
        retention-days: 7

  # ============================================
  # Job 3: Summary & Status
  # ============================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    if: always()
    
    steps:
    - name: ✅ All tests passed
      if: needs.unit-tests.result == 'success' && needs.e2e-tests.result == 'success'
      run: |
        echo "🎉 All tests passed successfully!"
        echo "✅ Unit Tests: PASSED"
        echo "✅ E2E Tests: PASSED"
    
    - name: ⚠️ Some tests failed
      if: needs.unit-tests.result != 'success' || needs.e2e-tests.result != 'success'
      run: |
        echo "⚠️ Some tests failed:"
        echo "Unit Tests: ${{ needs.unit-tests.result }}"
        echo "E2E Tests: ${{ needs.e2e-tests.result }}"
        exit 1